name: Unzip project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project.zip into repo
        run: |
          test -f project.zip
          unzip -q project.zip -d _tmp
          rm project.zip
          cp -a _tmp/. .
          rm -rf _tmp
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add project files"
          git push
